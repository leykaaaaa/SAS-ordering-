<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Silog+ | Sales Report</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="sales-page">

        <!-- HEADER -->

        <header class="sales-header">

            <div>

                <a
                    href="index.html"
                    class="back-link"
                >
                    ← Back to Menu
                </a>

                <h1>
                    Sales Report
                </h1>

                <p>
                    Monitor today's orders and sales.
                </p>

            </div>

            <button
                id="resetSales"
                class="reset-button"
            >
                Reset Sales
            </button>

        </header>


        <!-- STATISTICS -->

        <section class="stats-grid">

            <div class="stat-card">

                <span>
                    TODAY'S SALES
                </span>

                <strong id="totalSales">
                    ₱0.00
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    TOTAL ORDERS
                </span>

                <strong id="totalOrders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    ITEMS SOLD
                </span>

                <strong id="itemsSold">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    BEST SELLER
                </span>

                <strong id="bestSeller">
                    —
                </strong>

            </div>

        </section>


        <!-- PRODUCT SALES -->

        <section class="report-card">

            <div class="report-heading">

                <div>

                    <span class="small-label">
                        SALES BREAKDOWN
                    </span>

                    <h2>
                        Items Sold
                    </h2>

                </div>

                <select id="salesFilter">

                    <option value="today">
                        Today
                    </option>

                    <option value="all">
                        All Time
                    </option>

                </select>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                PRODUCT
                            </th>

                            <th>
                                QUANTITY SOLD
                            </th>

                            <th>
                                REVENUE
                            </th>

                        </tr>

                    </thead>

                    <tbody id="salesTable"></tbody>

                </table>

            </div>

        </section>


        <!-- TRANSACTIONS -->

        <section class="report-card">

            <div class="report-heading">

                <div>

                    <span class="small-label">
                        ORDER HISTORY
                    </span>

                    <h2>
                        Transactions
                    </h2>

                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ORDER #
                            </th>

                            <th>
                                TIME
                            </th>

                            <th>
                                ORDER
                            </th>

                            <th>
                                TOTAL
                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="transactionTable"
                    ></tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/data.js"></script>
    <script src="js/sales.js"></script>

</body>
</html>
