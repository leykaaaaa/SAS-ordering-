<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silog+ | Menu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <h2>Silog+</h2>
            <p>Ordering System</p>
        </div>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="orders.html">Orders</a>
            <a href="menu.html" class="active">Menu</a>
            <a href="sales.html">Sales Report</a>
        </nav>

    </aside>

    <main class="main">

        <header>
            <div>
                <h1>Menu Management</h1>
                <p>Manage your silog meals and drinks</p>
            </div>

            <button class="primary-button" onclick="openModal()">
                + Add Product
            </button>
        </header>

        <section class="card">

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="menuTable"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<!-- MODAL -->

<div id="productModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Add Product</h2>
            <button onclick="closeModal()">×</button>
        </div>

        <form id="productForm">

            <label>Product Name</label>

            <input
                type="text"
                id="productName"
                required
            >

            <label>Category</label>

            <select id="productCategory">

                <option value="Silog Meal">
                    Silog Meal
                </option>

                <option value="Drinks">
                    Drinks
                </option>

            </select>

            <label>Price</label>

            <input
                type="number"
                id="productPrice"
                min="1"
                step="0.01"
                required
            >

            <button class="primary-button" type="submit">
                Save Product
            </button>

        </form>

    </div>

</div>

<script src="js/data.js"></script>
<script src="js/menu.js"></script>

</body>
</html>
