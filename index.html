<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silog & Lemonade | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo">
            <h2>Silog+</h2>
            <p>Ordering System</p>
        </div>

        <nav>
            <a href="index.html" class="active">Dashboard</a>
            <a href="orders.html">Orders</a>
            <a href="menu.html">Menu</a>
            <a href="sales.html">Sales Report</a>
        </nav>
    </aside>

    <main class="main">

        <header>
            <div>
                <h1>Dashboard</h1>
                <p>Today's sales overview</p>
            </div>

            <div id="currentDate"></div>
        </header>

        <section class="stats">

            <div class="stat-card">
                <span>Total Sales</span>
                <h2 id="totalSales">₱0.00</h2>
            </div>

            <div class="stat-card">
                <span>Total Orders</span>
                <h2 id="totalOrders">0</h2>
            </div>

            <div class="stat-card">
                <span>Items Sold</span>
                <h2 id="itemsSold">0</h2>
            </div>

            <div class="stat-card">
                <span>Best Seller</span>
                <h2 id="bestSeller">---</h2>
            </div>

        </section>

        <section class="dashboard-grid">

            <div class="card">
                <div class="card-header">
                    <h2>Today's Sales</h2>
                    <a href="sales.html">View Report</a>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Quantity Sold</th>
                                <th>Revenue</th>
                            </tr>
                        </thead>

                        <tbody id="dashboardSales"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Recent Orders</h2>
                </div>

                <div id="recentOrders"></div>
            </div>

        </section>

    </main>

</div>

<script src="js/data.js"></script>

<script>
    document.getElementById("currentDate").textContent =
        new Date().toLocaleDateString("en-PH", {
            year: "numeric",
            month: "long",
            day: "numeric"
        });

    function peso(amount) {
        return "₱" + amount.toLocaleString("en-PH", {
            minimumFractionDigits: 2
        });
    }

    const orders = getOrders();

    const today = new Date().toDateString();

    const todayOrders = orders.filter(order =>
        new Date(order.date).toDateString() === today
    );

    let totalSales = 0;
    let totalItems = 0;
    const productSales = {};

    todayOrders.forEach(order => {

        totalSales += order.total;

        order.items.forEach(item => {

            totalItems += item.quantity;

            if (!productSales[item.name]) {
                productSales[item.name] = {
                    quantity: 0,
                    revenue: 0
                };
            }

            productSales[item.name].quantity += item.quantity;
            productSales[item.name].revenue +=
                item.price * item.quantity;
        });
    });

    document.getElementById("totalSales").textContent =
        peso(totalSales);

    document.getElementById("totalOrders").textContent =
        todayOrders.length;

    document.getElementById("itemsSold").textContent =
        totalItems;

    let bestSeller = "---";

    Object.keys(productSales).forEach(name => {

        if (
            bestSeller === "---" ||
            productSales[name].quantity >
            productSales[bestSeller].quantity
        ) {
            bestSeller = name;
        }

    });

    document.getElementById("bestSeller").textContent =
        bestSeller;

    const salesBody =
        document.getElementById("dashboardSales");

    Object.keys(productSales).forEach(name => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${name}</td>
            <td>${productSales[name].quantity}</td>
            <td>${peso(productSales[name].revenue)}</td>
        `;

        salesBody.appendChild(row);
    });

    const recentOrders =
        document.getElementById("recentOrders");

    todayOrders.slice(-5).reverse().forEach(order => {

        const div = document.createElement("div");

        div.className = "recent-order";

        div.innerHTML = `
            <div>
                <strong>Order #${order.id}</strong>
                <small>
                    ${new Date(order.date).toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    })}
                </small>
            </div>

            <strong>${peso(order.total)}</strong>
        `;

        recentOrders.appendChild(div);
    });
</script>

</body>
  </html>
